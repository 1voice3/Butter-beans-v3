const FACTS={butterfly:"Butterflies taste with their feet! They sip sweet nectar from flowers and are most busy in spring and summer. Their babies, caterpillars, munch on leaves.",moth:"Moths mostly come out at night and use the moon to find their way. Many love to flutter around porch lights. Their caterpillars eat leaves.",ant:"Ants live in big families called colonies. They can carry things much heavier than themselves! You can find them almost everywhere, all year.",bee:"Bees visit flowers and carry pollen, which helps plants grow fruit. They are busiest in spring and summer and live in hives.",ladybug:"Ladybugs are beetles that eat tiny pests called aphids. Their bright red color tells birds, don't eat me! Look for them on garden plants.",beetle:"Beetles are the biggest insect family on Earth. They have hard shell wings that cover softer flying wings. Many eat leaves, wood, or other bugs.",dragonfly:"Dragonflies zoom near ponds and can fly forward, backward, and hover. They eat mosquitoes! Look for them in summer near water.",grasshopper:"Grasshoppers jump super far with strong back legs. They munch on grass and leaves, and are easiest to spot in summer and fall.",cricket:"Crickets sing by rubbing their wings together. Only the boys chirp! They like grass and leaves and sing on warm nights.",fly:"Flies have two wings, not four like most insects. They taste with their feet and can walk on the ceiling!",caterpillar:"Caterpillars eat and eat leaves, then turn into butterflies or moths. They grow so fast they wiggle out of their old skin!",wasp:"Wasps build paper nests by chewing wood into pulp. Many eat other bugs that bother gardens. They are most active in summer.",firefly:"Fireflies make their own light to talk to each other on warm summer nights. Their babies often live in damp grass.",mantis:"Praying mantises hold their front legs up like they are praying, but they are hunting other bugs! They hide on green plants.",spider:"Spiders are arachnids, not insects, because they have eight legs! Many spin silk webs to catch tiny bugs to eat.",cicada:"Cicadas sing very loudly in summer. Some spend years underground before they climb up into the sunshine!"};
const fact=n=>{n=n.toLowerCase();for(const k in FACTS)if(n.includes(k))return FACTS[k];return"Every insect has six legs and three body parts: head, middle, and tail end. This one is a special find! Ask a grown-up to open Google Lens to learn more."};
$('cam').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,380/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);identify(c.toDataURL('image/jpeg',.6))};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
function lens1(img){sub(`<h2>Look closer! 🔍</h2><div class="card"><img src="${img}"><p>Let's ask Google Lens what this bug is! Tap the blue button, pick this photo, then come back here.</p><a target="_blank" href="https://lens.google.com/"><button class="t" style="background:#4285f4">Open Google Lens 🔍</button></a> <a download="bug.jpg" href="${img}"><button class="t" style="background:#ff924c">💾 Save photo</button></a><br><button class="t" id="nxt">I'm back ➡</button></div>`);$('nxt').onclick=()=>ask(img);speak("Let's ask Google Lens! Tap the blue button, then come back and tell me the name!")}
function ask(img,pre){let tx=null;sub(`<h2>What bug is this?</h2><div class="card"><img src="${img}"><p>Type its name (like ant, bee, ladybug) 🐞</p><input id="nm" style="font:inherit;font-size:26px;width:90%;padding:8px;border-radius:14px;border:3px solid #ffb703"><div id="sg"></div><button class="t" id="mic">🎤 Say it</button><button class="t" id="sv">Save ✔</button></div>`);
 if(pre)$('nm').value=pre;let sgT;$('nm').oninput=()=>{tx=null;clearTimeout(sgT);const q=$('nm').value.trim();if(q.length<3)return;sgT=setTimeout(()=>fetch('https://api.inaturalist.org/v1/taxa/autocomplete?per_page=6&taxon_id=47120&q='+encodeURIComponent(q)).then(r=>r.json()).then(j=>{$('sg').innerHTML=j.results.map((t,i)=>`<button class="t" style="background:#6a4c93;font-size:16px" data-i="${i}">${esc(t.preferred_common_name||t.name)}</button>`).join('');$('sg').querySelectorAll('button').forEach(b=>b.onclick=()=>{tx=j.results[b.dataset.i];$('nm').value=tx.preferred_common_name||tx.name;$('sg').innerHTML='✔ '+esc(tx.name)})}).catch(()=>{}),350)};
 $('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return speak("Type it instead!");const r=new R();r.onresult=e=>{$('nm').value=e.results[0][0].transcript.split(' ').at(-1);$('nm').oninput()};r.start()};
 $('sv').onclick=()=>{const n=$('nm').value.trim();if(!/[a-z]/i.test(n))return speak("Tell me its name first!");savePic(img,n,tx,{})}}
function savePic(img,n,tx,ex){const p=Object.assign({id:Date.now(),n:n,l:n.match(/[a-z]/i)[0].toUpperCase(),img,t:new Date().toLocaleString()},ex);
 const fin=()=>{S.pics.push(p);try{localStorage.hz=JSON.stringify(S.pics)}catch(e){speak("Memory is full! Ask a grown-up to export first.")}ok();swoosh();setTimeout(()=>{phase='menu';$('back').click();setTimeout(()=>{const t=document.querySelector(`[data-l="${p.l}"]`);if(t){const r=t.getBoundingClientRect();t.scrollIntoView({block:'center'});B.sc=.38;fly(r.left+r.width/2,r.top+r.height/2);speak(`${p.n} starts with ${p.l}! ${p.l} is for ${p.n}!`)}},600)},900)};
 const go=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(g=>{p.la=g.coords.latitude;p.lo=g.coords.longitude;fin()},fin,{timeout:5000}):fin();
 if(tx)p.sci=tx.name;(tx&&tx.wikipedia_url?fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+tx.wikipedia_url.split('/').pop()).then(r=>r.json()).then(j=>{p.wiki=(j.extract||'').split('. ').slice(0,3).join('. ')}).catch(()=>{}):Promise.resolve()).then(go)}
const PROMPT='You help a 7-year-old girl named Hazel identify bugs from her photo. Reply with ONLY JSON, no other text: {"found":true or false,"name":"simple common name, 1-2 words (use the scientific name only if no simple name exists)","sci":"scientific name","facts":"3 short sentences a 7 year old can read: where it lives, what it eats, and which seasons it is seen","story":"a fun 3-sentence mini story for a 7 year old about this bug, starring Hazel"}. If no insect, spider or bug is visible, set found to false.';
function setKey(){const k=prompt('Grown-up: paste your Anthropic API key. It is saved only on this phone. (Leave blank to remove it.)',localStorage.hzk||'');if(k===null)return localStorage.hzk;if(k.trim())localStorage.hzk=k.trim();else localStorage.removeItem('hzk');return localStorage.hzk}
$('st').onclick=setKey;
async function identify(img){if(!localStorage.hzk&&!setKey())return ask(img);
 sub(`<h2>Flutter is looking... 🔍</h2><div class="card"><img src="${img}"><p>Let me see what bug this is!</p></div>`);speak("Hmm, let me look very closely at your bug!");
 try{const c=new AbortController();setTimeout(()=>c.abort(),25000);
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:c.signal,headers:{'content-type':'application/json','x-api-key':localStorage.hzk,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:700,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img.split(',')[1]}},{type:'text',text:PROMPT}]}]})});
  const j=await r.json();if(r.status==401){localStorage.removeItem('hzk');throw 0}if(!j.content)throw 0;
  const d=JSON.parse(j.content.map(x=>x.text||'').join('').replace(/```json|```/g,'').trim());
  if(!d.found||!/[a-z]/i.test(d.name||'')){speak("I can't see a bug! Let's try again or tell me its name.");return ask(img)}
  sub(`<h2>I found it! ✨</h2><div class="card"><img src="${img}"><p class="big" style="font-size:12vw;margin:0">${esc(d.name)}</p><small>${esc(d.sci||'')}</small><p>${esc(d.facts||'')}</p><button class="t" id="yes">Yes! ✔</button><button class="t" style="background:#ff924c" id="no">Not right ✏️</button></div>`);
  speak(`It's a ${d.name}! ${d.facts||''}`);
  $('yes').onclick=()=>savePic(img,d.name,null,{sci:d.sci,wiki:d.facts,st:d.story?[d.story]:null});$('no').onclick=()=>ask(img,d.name)
 }catch(e){speak("My bug-finding glasses aren't working. Tell me its name!");ask(img)}}
// ---------- letter / lens
function letter(L){const ps=S.pics.filter(p=>p.l==L);if(!ps.length){speak(`No bug for ${L} yet! Find one that starts with ${L}!`);return}
 sub(`<p class="big">${L}</p>`+ps.map(p=>`<div class="card"><img src="${p.img}"><h2>${esc(p.n)}</h2><small>${esc(p.t)}${p.la?' · 📍 '+p.la.toFixed(3)+', '+p.lo.toFixed(3):''}</small><br><button class="t" data-lens="${p.id}">🔍 Look closer</button></div>`).join(''));
 $('sub').querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{const p=S.pics.find(x=>x.id==b.dataset.lens);const t=`${p.n} starts with the letter ${L}, so it lives in the ${L} box! ${(p.wiki||fact(p.n))}`;speak(t,ok);b.insertAdjacentHTML('afterend',`<p>${esc(t)}</p><a href="https://lens.google.com/" target="_blank"><button class="t" style="background:#4285f4">Open Google Lens 🔍</button></a>`);b.remove()})}
// ---------- map
let tour=0;const stopTour=()=>tour++;
function mapScr(){const ps=S.pics.slice().sort((a,b)=>a.l<b.l?-1:1);const g=ps.filter(p=>p.la!=null);
 const la=g.map(p=>p.la),lo=g.map(p=>p.lo),mnA=Math.min(...la),mxA=Math.max(...la),mnO=Math.min(...lo),mxO=Math.max(...lo);
 const pos=ps.map((p,i)=>{let x,y;if(p.la!=null&&(mxA>mnA||mxO>mnO)){x=40+(p.lo-mnO)/((mxO-mnO)||1)*240;y=360-(p.la-mnA)/((mxA-mnA)||1)*320}else{x=60+(i%4)*70;y=120+Math.floor(i/4)*70}return{p,x,y}});
 sub(`<h2>My Bug Map 🗺️</h2><svg id="mp" viewBox="0 0 320 400" style="width:100%;background:#c8f7c5;border:5px solid #fff;border-radius:24px"><circle cx="60" cy="70" r="40" fill="#8ac926"/><circle cx="260" cy="320" r="55" fill="#8ac926"/><ellipse cx="240" cy="90" rx="50" ry="25" fill="#7fd8ff"/><path d="M0 220Q80 180 160 230T320 200" stroke="#7fd8ff" stroke-width="18" fill="none"/><polyline points="${pos.map(q=>q.x+','+q.y).join(' ')}" fill="none" stroke="#ff6fa5" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>${pos.map((q,i)=>`<g data-i="${i}" style="cursor:pointer"><circle cx="${q.x}" cy="${q.y}" r="19" fill="${COL[i%7]}" stroke="#fff" stroke-width="3"/><text x="${q.x}" y="${q.y+8}" text-anchor="middle" font-size="22" fill="#fff" font-weight="900">${q.p.l}</text></g>`).join('')}</svg>
 <div style="text-align:center"><button class="t" id="gl">🌍 Fly around</button><a target="_blank" onclick="speak('Tap Done or Back at the top to come back to me!')" href="https://www.google.com/maps/search/?api=1&query=${g.length?g[0].la+','+g[0].lo:'insects'}"><button class="t" style="background:#4285f4">Google Maps 🗺️</button></a></div>`);
 const go=i0=>{const my=++tour;let i=i0;const step=()=>{if(my!=tour||i>=pos.length)return;const q=pos[i],pt=$('mp').createSVGPoint();pt.x=q.x;pt.y=q.y;const s=pt.matrixTransform($('mp').getScreenCTM());B.sc=.4;fly(s.x,s.y-20);swoosh();speak(`${q.p.l} is for ${q.p.n}!`,()=>{i++;setTimeout(step,600)});if(q.p.la!=null)$('gl').nextSibling.href=`https://earth.google.com/web/@${q.p.la},${q.p.lo},0a,500d,35y,0h,0t,0r`};step()};
 $('gl').onclick=()=>go(0);document.querySelectorAll('#mp g').forEach(e=>e.onclick=()=>go(+e.dataset.i))}
// ---------- books
function story(ps,said){const pg=[],ds=S.pics.map(p=>p.id).sort(),f=d=>new Date(d).toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'}),rg=ds.length?(f(ds[0])==f(ds.at(-1))?f(ds[0]):f(ds[0])+' to '+f(ds.at(-1))):'';
pg.push({L:'📖',t:`Hazel's Bug Book. Bugs found ${rg}.`});
ps.slice(0,3).forEach(p=>{pg.push({L:p.l,img:p.img,t:`${p.l} is for ${p.n}! Hazel went out to look for bugs. She found a ${p.n} ${p.la!=null?'at a special spot on her map':'on a sunny day'}.`});pg.push({L:p.l,img:p.img,t:said?`Hazel said, "${said}"`:'Hazel looked very close and said hello.'});pg.push({L:p.l,t:p.st?p.st.join(' '):(p.wiki||fact(p.n)).split('. ').slice(0,2).join('. ')+'.'})});
while(pg.length<5)pg.push({L:'★',t:'Hazel waved goodbye. What bug will she find next? The end!'});pg.push({L:'★',t:'The end! Hazel is a bug explorer!'});return pg.slice(0,10)}
const sig=()=>S.pics.map(p=>p.id).join();
function pages(){const pg=story(S.pics.slice().sort((a,b)=>a.l<b.l?-1:1));try{const e=JSON.parse(localStorage.hzb||'null');if(e&&e.s==sig())pg.forEach((p,i)=>{if(e.t[i]!=null)p.t=e.t[i]})}catch(_){}return pg}
function editor(pr){const pg=pages();sub(`<h2>Grown-ups: read &amp; edit together ✏️</h2>`+pg.map((p,i)=>`<div class="card">${p.img?`<img src="${p.img}" style="max-height:140px">`:''}<b>${p.L}</b><textarea style="width:100%;font:inherit;font-size:18px;height:110px">${esc(p.t)}</textarea></div>`).join('')+`<div style="text-align:center"><button class="t" id="sv2">Save ✔</button>${pr?'<button class="t" style="background:#1982c4" id="mk">🖨️ Make PDF</button>':''}<button class="t" style="background:#999" id="rs">Start over</button></div>`);
const sv=()=>{localStorage.hzb=JSON.stringify({s:sig(),t:[...$('sub').querySelectorAll('textarea')].map(x=>x.value)})};
$('sv2').onclick=()=>{sv();ok()};$('rs').onclick=()=>{localStorage.removeItem('hzb');editor(pr)};
if(pr)$('mk').onclick=()=>{sv();$('print').innerHTML=pages().map(p=>`<div class="pp"><h1>${p.L}</h1>${p.img?`<img src="${p.img}">`:''}<p>${esc(p.t)}</p></div>`).join('');print()}}
function book(sh){sub(`<h2>${sh?'Share My Book ➡️':'My Stories 📖'}</h2><div style="text-align:center"><button class="t" data-r="abc">📖 ABC<br>Read</button><button class="t" data-r="ear" style="background:#ff924c">📖👂<br>Listen</button><button class="t" data-r="mouth" style="background:#ff595e">📖👄<br>Tell me!</button><br><button class="t" style="background:#6a4c93" id="ed">✏️ Grown-ups edit</button>${sh?'<button class="t" style="background:#1982c4" id="pr">🖨️ Review &amp; PDF</button>':''}</div>`);
$('sub').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const m=b.dataset.r;if(m=='mouth'){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){return speak("Your phone can't hear yet. Try Read!")}speak("Tell me about your bug!",()=>{const r=new R();r.onresult=e=>reader(story([S.pics.at(-1)],e.results[0][0].transcript),true);r.onerror=()=>speak("I couldn't hear you. Try again!");r.start()})}else reader(pages(),m=='ear')});
$('ed').onclick=()=>editor(false);if($('pr'))$('pr').onclick=()=>editor(true)}
function reader(pg,listen){let i=0;const show=()=>{sub(`<p class="big" style="font-size:16vw">${pg[i].L}</p><div class="card">${pg[i].img?`<img src="${pg[i].img}">`:''}</div><div class="pg">${esc(pg[i].t)}</div><div style="text-align:center">${i?'<button class="t" id="pv">⬅</button>':''}<button class="t" id="nx">${i<pg.length-1?'➡':'✔'}</button></div>`);
  $('nx').onclick=()=>{if(i<pg.length-1){i++;show()}else{ok();setTimeout(()=>$('back').click(),900)}};if($('pv'))$('pv').onclick=()=>{i--;show()};
  if(listen)speak(pg[i].t,()=>{if(i<pg.length-1){i++;show()}else $('nx').click()})};show()}
launch();
</script></body></html>
